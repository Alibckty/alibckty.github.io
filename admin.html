<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    padding:20px;
}

.card{
    background:#1f2937;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

h2{color:#38bdf8;}
</style>
</head>

<body>

<h2>📊 OY ANALİZ PANELİ</h2>

<div class="card" id="avg">Ortalama: Yükleniyor...</div>
<div class="card" id="count">Toplam Oy: Yükleniyor...</div>
<div class="card" id="best">En İyi Makale: Yükleniyor...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "XXX",
    authDomain: "XXX",
    projectId: "XXX",
    storageBucket: "XXX",
    messagingSenderId: "XXX",
    appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadData(){

    const snapshot = await getDocs(collection(db,"ratings"));

    let total = 0;
    let count = 0;

    let articleMap = {};

    snapshot.forEach(doc => {
        const data = doc.data();

        const stars = data.stars;
        const articleId = data.articleId;

        total += stars;
        count++;

        if(!articleMap[articleId]){
            articleMap[articleId] = {total:0, count:0};
        }

        articleMap[articleId].total += stars;
        articleMap[articleId].count++;
    });

    // Ortalama
    let avg = (total / count).toFixed(2);

    document.getElementById("avg").innerText =
        "Ortalama Puan: " + avg;

    document.getElementById("count").innerText =
        "Toplam Oy: " + count;

    // En iyi makale
    let bestId = "";
    let bestAvg = 0;

    for(let id in articleMap){
        let a = articleMap[id].total / articleMap[id].count;

        if(a > bestAvg){
            bestAvg = a;
            bestId = id;
        }
    }

    document.getElementById("best").innerText =
        "En İyi Makale: " + bestId + " (" + bestAvg.toFixed(2) + ")";

}

loadData();

</script>

</body>
</html>
